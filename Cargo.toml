[package]
name = "grovekeeper"
version = "0.1.0"
edition = "2021"
description = "A tiny, fast Windows tray toolkit. Starts with DDC/CI monitor control: brightness, contrast, volume, input and power."
license = "MIT"
repository = "https://github.com/Tier17/grovekeeper"
readme = "README.md"
keywords = ["windows", "tray", "monitor", "brightness", "ddc"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
